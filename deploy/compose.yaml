services:
  keelway:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      KEELWAY_BIND_ADDR: "0.0.0.0:8080"
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      # Place keelway.yaml (configured with tape_path: /var/lib/keelway/keelway-tape.jsonl)
      # and policies/ under ./config/
      - ./config:/etc/keelway:ro
      - keelway_data:/var/lib/keelway
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      keelway:
        condition: service_healthy
    restart: unless-stopped

volumes:
  keelway_data:
  prometheus_data:
