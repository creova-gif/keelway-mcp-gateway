apiVersion: v1
kind: Service
metadata:
  name: keelway-gateway
  labels:
    app.kubernetes.io/name: keelway-gateway
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8080"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: keelway-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
