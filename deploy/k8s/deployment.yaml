apiVersion: apps/v1
kind: Deployment
metadata:
  name: keelway-gateway
  labels:
    app.kubernetes.io/name: keelway-gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: keelway-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keelway-gateway
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keelway-gateway
          image: keelway-mcp-gateway:latest
          imagePullPolicy: IfNotPresent
          args:
            - gateway
            - up
            - --config
            - /etc/keelway/keelway.yaml
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: KEELWAY_BIND_ADDR
              value: "0.0.0.0:8080"
            - name: KEELWAY_TAPE_PATH
              value: "/var/lib/keelway/keelway-tape.jsonl"
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/keelway
              readOnly: true
            - name: data
              mountPath: /var/lib/keelway
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: keelway-config
        - name: data
          persistentVolumeClaim:
            claimName: keelway-data
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
